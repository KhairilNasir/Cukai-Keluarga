<script>
/* ============ CONFIG ============ */
// Paste your Apps Script Web app URL here (see README). Leave empty to keep data on this device only.
const API_URL = "https://script.google.com/macros/s/AKfycbzTcLOUBaVEZoC0_a5iL-LnOtHfUY63tkkKs_HTKAQVsYtMvNtT8yjziyE9tL4P8bAM/exec";

/* ============ TAX RULES ============
   YA 2026 (income earned 1 Jan – 31 Dec 2026). Source: PwC Malaysian Tax Booklet 2026/2027 and LHDN relief list.
   Check these each year after the Budget is gazetted. */
const RULES = {
  2026: {
    label: "YA 2026", deadline: "30 Apr 2027",
    bands: [[0,5000,0],[5000,20000,1],[20000,35000,3],[35000,50000,6],[50000,70000,11],[70000,100000,19],[100000,400000,25],[400000,600000,26],[600000,2000000,28],[2000000,Infinity,30]],
    self: 9000, disabledSelf: 7000, spouse: 4000, disabledSpouse: 6000,
    child: { u18: 2000, preU: 2000, higher: 8000, dis: 8000, disHigher: 16000 },
    epf: 4000, socso: 350, rebate: 400, rebateCap: 35000,
    cats: [
      {k:"lifestyle", n:"Lifestyle", lim:2500, d:"Books and e-books, computer, smartphone or tablet, internet bills, self-improvement courses. Self, spouse or child."},
      {k:"sports", n:"Sports", lim:1000, d:"Sports equipment, court or facility rental, competition fees, gym or training fees. Self, spouse, child or parents."},
      {k:"medical", n:"Medical (self, spouse, child)", lim:10000, d:"Serious disease, fertility treatment, vaccination, dental, check-ups and mental health, child learning-disability care.",
        subs:[{k:"serious",n:"Serious disease treatment"},{k:"fertility",n:"Fertility treatment"},{k:"vaccine",n:"Vaccination",lim:1000},{k:"dental",n:"Dental examination or treatment",lim:1000},{k:"checkup",n:"Check-up, self-test device, mental health",lim:1000},{k:"learning",n:"Child learning disability (18 and below)",lim:10000}]},
      {k:"parents", n:"Parents & grandparents medical", lim:8000, d:"Medical and dental treatment, carer or special-needs costs, full check-up including vaccination.",
        subs:[{k:"treat",n:"Medical or dental treatment"},{k:"care",n:"Carer or special-needs costs"},{k:"checkup",n:"Full check-up incl. vaccination",lim:1000}]},
      {k:"education", n:"Education fees (self)", lim:7000, d:"Diploma or degree in approved fields, any Masters or PhD, recognised upskilling courses.",
        subs:[{k:"degree",n:"Diploma or degree (approved fields)"},{k:"master",n:"Masters or PhD"},{k:"upskill",n:"Upskilling course (recognised)",lim:2000}]},
      {k:"life", n:"Life insurance / takaful & voluntary EPF", lim:3000, d:"Life or family takaful premiums for self, spouse or child, plus voluntary EPF top-ups."},
      {k:"edumed", n:"Education & medical insurance", lim:4000, d:"Medical card or education policy premiums for self, spouse or child."},
      {k:"prs", n:"PRS & deferred annuity", lim:3000, d:"Private Retirement Scheme contributions and deferred annuity premiums."},
      {k:"childcare", n:"Childcare & kindergarten", lim:3000, d:"Fees to a registered childcare centre or kindergarten (child 6 and below), or care centre (12 and below)."},
      {k:"sspn", n:"SSPN savings", lim:8000, d:"Net deposit into a child's SSPN account this year (deposits minus withdrawals). Either parent can claim."},
      {k:"breastfeed", n:"Breastfeeding equipment", lim:1000, d:"For a child aged 2 and below. Once every two years."},
      {k:"ev", n:"EV charger, compost machine, food waste grinder, CCTV", lim:2500, d:"Home EV charging costs; one household compost machine, food waste grinder or CCTV purchase."},
      {k:"tourism", n:"Tourist attractions, arts & culture", lim:1000, d:"Entrance fees to tourist attractions and arts or cultural programmes. YA 2026 only."},
      {k:"disabledEq", n:"Equipment for disabled family member", lim:6000, d:"Supporting equipment for a disabled self, spouse, child or parent."},
      {k:"housing", n:"First home loan interest", lim:7000, limKey:"housingLim", d:"Interest on a first home bought under an SPA dated 2025–2027, for 3 years. RM7,000 if price ≤ RM500k, RM5,000 if RM500k–750k."},
      {k:"zakat", n:"Zakat & fitrah", rebate:true, d:"Rebate: cuts your tax ringgit for ringgit, up to the tax you owe."},
      {k:"umrah", n:"Departure levy for umrah or haj", rebate:true, d:"Rebate: the levy you paid, up to two trips in a lifetime."}
    ]
  }
};

const THIS_YEAR = new Date().getFullYear();
/* Other years are built from YA 2026 with their differences. */
(function(){
  const base = RULES[2026];
  const copy = y => ({ ...base, bands: base.bands.map(b=>b.slice()), child:{...base.child},
    cats: base.cats.map(c=>({ ...c, subs: c.subs ? c.subs.map(x=>({...x})) : undefined })) });
  const cat = (y,k) => y.cats.find(c=>c.k===k);

  // YA 2025 — income 2025, filed in 2026
  const y25 = copy(); y25.label = "YA 2025"; y25.deadline = "30 Apr 2026";
  y25.cats = y25.cats.filter(c=>c.k!=="tourism");
  cat(y25,"medical").subs.find(x=>x.k==="learning").lim = 6000;
  cat(y25,"ev").n = "EV charger & compost machine";
  cat(y25,"ev").d = "Home EV charging costs; one household food waste compost machine.";
  RULES[2025] = y25;

  // YA 2027 — Budget 2027 proposals, not yet law
  const y27 = copy(); y27.label = "YA 2027 (proposed)"; y27.deadline = "30 Apr 2028"; y27.proposed = true;
  y27.self = 12000;
  y27.bands = [[0,5000,0],[5000,20000,1],[20000,35000,3],[35000,50000,6],[50000,70000,11],[70000,100000,18],[100000,150000,24],[150000,400000,25],[400000,600000,26],[600000,1000000,28],[1000000,Infinity,30]];
  cat(y27,"medical").subs.push({k:"postnatal",n:"Postnatal / confinement care",lim:3000});
  cat(y27,"tourism").d = "Entrance fees to tourist attractions and arts or cultural programmes. Proposed extension to YA 2027.";
  RULES[2027] = y27;

  // YA 2028 onwards — not announced yet. Carry the latest known rules forward and drop reliefs that have an end year.
  // When a Budget is announced, add that year above with its real figures.
  const until = { tourism:2027, sspn:2027, prs:2030, housing:2030 };
  const lastYear = Math.max(2040, THIS_YEAR + 2);
  for (let y = 2028; y <= lastYear; y++){
    const e = { ...y27, bands: y27.bands.map(b=>b.slice()), child:{...y27.child},
      cats: y27.cats.filter(c => !until[c.k] || y <= until[c.k]).map(c=>({ ...c, subs: c.subs ? c.subs.map(x=>({...x})) : undefined })) };
    e.label = `YA ${y} (estimate)`; e.deadline = `30 Apr ${y+1}`; e.proposed = false; e.estimate = true;
    RULES[y] = e;
  }
})();
const YEARS = Object.keys(RULES).map(Number).sort();


/* ============ STATE ============ */
const LS_KEY = "cukaiKeluarga.v1";
const LS_CONN = "cukaiKeluarga.conn";
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const blankPerson = (name) => ({ id: uid(), name, disabled:false, spouseRelief:false, spouseDisabled:false, housingLim:7000,
  kids:{u18:0,preU:0,higher:0,dis:0,disHigher:0} });
const blankIncome = () => ({ monthly:0, months:12, bonus:0, pcbMonthly:0, pcbBonus:0, epfMonthly:0, socsoMonthly:0 });

function sampleState(){
  const a = blankPerson("Me"), b = blankPerson("Spouse");
  a.kids.u18 = 1;
  const s = { v:1, ya:2026, sample:true, people:[a,b], income:{}, claims:[] };
  s.income["2026:"+a.id] = { monthly:6500, months:12, bonus:6500, pcbMonthly:310, pcbBonus:620, epfMonthly:715, socsoMonthly:29.75 };
  s.income["2026:"+b.id] = { monthly:4800, months:12, bonus:0, pcbMonthly:95, pcbBonus:0, epfMonthly:528, socsoMonthly:23.75 };
  const add = (p,cat,sub,date,amt,desc) => s.claims.push({id:uid(),ya:2026,person:p.id,cat,sub,date,amount:amt,desc,receipt:""});
  add(a,"lifestyle","","2026-02-14",1899,"Laptop");
  add(a,"lifestyle","","2026-06-30",714,"Home fibre, Jan–Jun");
  add(a,"sports","","2026-03-02",420,"Badminton court rental");
  add(a,"medical","checkup","2026-05-10",380,"Full medical check-up");
  add(a,"life","","2026-09-01",2400,"Takaful premium");
  add(a,"edumed","","2026-09-01",1680,"Medical card");
  add(a,"sspn","","2026-10-05",3000,"SSPN deposit for child");
  add(a,"zakat","","2026-11-01",1200,"Zakat pendapatan");
  add(b,"lifestyle","","2026-04-11",3299,"Smartphone");
  add(b,"parents","treat","2026-07-20",950,"Mother's clinic visits");
  add(b,"tourism","","2026-08-15",160,"Museum and zoo tickets");
  return s;
}
let S = loadLocal() || sampleState();
let conn = (()=>{ try { return JSON.parse(localStorage.getItem(LS_CONN)||"null"); } catch(e){ return null; } })();
let ui = { tab:"overview", claimPerson:"all", claimCat:"all", editing:null, filePerson:null };

function loadLocal(){ try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
function R(){ return RULES[S.ya] || RULES[2026]; }
const LS_YA = "cukaiKeluarga.ya";
function prefYa(){ let y; try { y = +localStorage.getItem(LS_YA); } catch(e){} return RULES[y] ? y : (RULES[THIS_YEAR] ? THIS_YEAR : 2026); }
// Person settings (children, OKU, spouse relief) are kept per year; a new year starts from the nearest year already set.
function ps(p, ya=S.ya){
  S.pset = S.pset || {};
  const k = ya+":"+p.id;
  if (!S.pset[k]){
    const near = YEARS.filter(y=>S.pset[y+":"+p.id]).sort((a,b)=>Math.abs(a-ya)-Math.abs(b-ya))[0];
    const src = near ? S.pset[near+":"+p.id] : p;
    S.pset[k] = { disabled:!!src.disabled, spouseRelief:!!src.spouseRelief, spouseDisabled:!!src.spouseDisabled,
      housingLim:+src.housingLim||7000, kids:{u18:0,preU:0,higher:0,dis:0,disHigher:0, ...(src.kids||{})} };
  }
  return S.pset[k];
}
function withYa(y, fn){ const o = S.ya; S.ya = y; try { return fn(); } finally { S.ya = o; } }
function yearsWithData(){
  return YEARS.filter(y => S.claims.some(c=>c.ya===y) || S.people.some(p=>{ const i=S.income[y+":"+p.id]; return i && (+i.monthly||+i.bonus); }));
}
function inc(p){ const k = S.ya+":"+p.id; if(!S.income[k]) S.income[k] = blankIncome(); return S.income[k]; }

/* ============ TAX ENGINE ============ */
function taxOn(ci, bands){
  let t = 0;
  for (const [lo,hi,rate] of bands){ if (ci > lo) t += (Math.min(ci,hi) - lo) * rate/100; }
  return Math.round(t*100)/100;
}
function compute(p){
  const r = R(), i = inc(p), P = ps(p);
  const months = Math.min(12, Math.max(0, +i.months || 0));
  const gross = (+i.monthly||0)*months + (+i.bonus||0);
  const pcb = (+i.pcbMonthly||0)*months + (+i.pcbBonus||0);
  const epfPaid = (+i.epfMonthly||0)*months, socsoPaid = (+i.socsoMonthly||0)*months;
  const lines = [];
  const push = (k,n,claimed,lim,auto) => lines.push({k,n,claimed,lim,allowed:Math.min(claimed,lim),auto});
  push("self","Individual",r.self,r.self,true);
  if (P.disabled) push("disSelf","Disabled individual",r.disabledSelf,r.disabledSelf,true);
  if (P.spouseRelief) push("spouse","Spouse (no income / joint)",r.spouse,r.spouse,true);
  if (P.spouseRelief && P.spouseDisabled) push("disSpouse","Disabled spouse",r.disabledSpouse,r.disabledSpouse,true);
  const kc = r.child, kids = P.kids||{};
  const kidAmt = (kids.u18||0)*kc.u18 + (kids.preU||0)*kc.preU + (kids.higher||0)*kc.higher + (kids.dis||0)*kc.dis + (kids.disHigher||0)*kc.disHigher;
  if (kidAmt) push("child","Child relief",kidAmt,kidAmt,true);
  push("epf","EPF (from payslip)",epfPaid,r.epf,true);
  push("socso","SOCSO / PERKESO (from payslip)",socsoPaid,r.socso,true);
  let rebates = 0; const rebateLines = [];
  const mine = S.claims.filter(c => c.person===p.id && c.ya===S.ya);
  for (const cat of r.cats){
    const cs = mine.filter(c => c.cat===cat.k);
    const claimed = cs.reduce((a,c)=>a+(+c.amount||0),0);
    if (cat.rebate){ if (claimed) rebateLines.push({k:cat.k,n:cat.n,claimed}); rebates += claimed; continue; }
    let eligible = claimed;
    if (cat.subs){
      eligible = 0;
      for (const sub of cat.subs){
        const s = cs.filter(c=>c.sub===sub.k).reduce((a,c)=>a+(+c.amount||0),0);
        eligible += sub.lim ? Math.min(s, sub.lim) : s;
      }
      eligible += cs.filter(c=>!cat.subs.some(s=>s.k===c.sub)).reduce((a,c)=>a+(+c.amount||0),0);
    }
    const lim = cat.limKey ? (+P[cat.limKey]||cat.lim) : cat.lim;
    lines.push({k:cat.k,n:cat.n,claimed,eligible,lim,allowed:Math.min(eligible,lim),auto:false});
  }
  const totalRelief = lines.reduce((a,l)=>a+l.allowed,0);
  const chargeable = Math.max(0, gross - totalRelief);
  const tax = taxOn(chargeable, r.bands);
  const rebate400 = (chargeable <= r.rebateCap && chargeable > 0) ? Math.min(r.rebate, tax) : 0;
  const afterRebate = Math.max(0, tax - rebate400);
  const zakatUsed = Math.min(rebates, afterRebate);
  const payable = Math.max(0, afterRebate - zakatUsed);
  const balance = Math.round((pcb - payable)*100)/100;
  const rate = chargeable ? r.bands.find(b=>chargeable>b[0] && chargeable<=b[1])?.[2] ?? 0 : 0;
  return { gross, pcb, months, lines, rebateLines, totalRelief, chargeable, tax, rebate400, rebates, zakatUsed, payable, balance, rate };
}

    <li><b>Settings</b> — put your names, tick spouse relief only if your spouse has no income, and enter your children under the parent who will claim them.</li>
    <li><b>Income &amp; PCB</b> — copy monthly gross salary, PCB, EPF and SOCSO from one payslip. Add bonus at year end. In February, check against your EA form.</li>
    <li><b>Reliefs &amp; receipts</b> — every time you buy something that counts (phone, internet bill, gym, insurance, clinic, SSPN), add it with a photo of the receipt.</li>
    <li><b>Overview</b> — see your estimated refund and which reliefs still have room before December.</li>
    <li><b>MyTax figures</b> — in March, open this tab and copy each amount into e-Filing on MyTax.</li>
  </ol>
  <h3>Tax years</h3>
  <p>Pick the year at the top. Each year keeps its own income, receipts and children settings, all in the same Google Sheet. YA ${THIS_YEAR} is the income you earn in ${THIS_YEAR} and file in ${THIS_YEAR+1}. A receipt dated in another year is saved under that year automatically. Past years stay for your records; LHDN can ask for proof up to 7 years back.</p>
  <h3>How the estimate is worked out</h3>
  <p>Yearly income minus reliefs gives chargeable income. Tax is worked out band by band with the ${r.label} resident rates, then the RM400 rebate (if chargeable income is RM35,000 or less) and zakat come off. What is left is compared with the PCB already cut from your salary: if PCB is higher, LHDN owes you a refund.</p>
  <div class="tablewrap"><table style="max-width:420px"><thead><tr><th>Chargeable income</th><th class="amt">Rate</th></tr></thead><tbody>
  ${r.bands.map(b=>`<tr><td class="mono small">${RM(b[0],0)} – ${b[1]===Infinity?"above":RM(b[1],0)}</td><td class="amt">${b[2]}%</td></tr>`).join("")}</tbody></table></div>
  <h3>Keep in mind</h3>
  <ul>
    <li>Keep receipts for 7 years. LHDN can ask for them in an audit.</li>
    <li>Relief only counts for money spent between 1 January and 31 December ${S.ya}.</li>
    <li>This app covers salaried income (Form BE). It does not handle rental, business, dividends or joint assessment.</li>
    <li>Limits follow the ${r.label} list as of November 2026. Budget 2027 proposals apply from YA 2027, not this year.</li>
    <li>This is an estimate to help you plan. It is not tax advice, and you file on MyTax yourself.</li>
  </ul>
  <h3>Sources</h3>
  <p class="small">LHDN tax relief list (hasil.gov.my) and PwC Malaysian Tax Booklet 2026/2027, personal income tax chapter.</p>
  </article></section>`;
}

/* ============ EVENT BINDING ============ */
const bind = {
  overview(){ document.querySelectorAll("[data-goya]").forEach(tr=>tr.onclick=()=>setYa(+tr.dataset.goya)); },
  income(){
    document.querySelectorAll("form[data-pid]").forEach(f=>{
      f.addEventListener("change", e=>{ const p = person(f.dataset.pid); inc(p)[e.target.name] = +e.target.value||0; changed(); });
    });
  },
  reliefs(){
    const catSel = $("#cCat");
    catSel.onchange = () => { const c = catOf(catSel.value);
      $("#catDesc").textContent = c.d; $("#subWrap").hidden = !c.subs;
      $("#cSub").innerHTML = (c.subs||[]).map(s=>`<option value="${s.k}">${esc(s.n)}${s.lim?` · max ${RM(s.lim,0)}`:""}</option>`).join(""); };
    $("#cSave").onclick = saveClaim;
    if ($("#cCancel")) $("#cCancel").onclick = () => { ui.editing=null; render(); };
    if ($("#cDel")) $("#cDel").onclick = () => { const b=$("#cDel"); if(b.dataset.sure){ S.claims = S.claims.filter(c=>c.id!==ui.editing); ui.editing=null; changed(); toast("Receipt deleted"); } else { b.dataset.sure=1; b.textContent="Tap again to delete"; } };
    $("#fPerson").onchange = e => { ui.claimPerson = e.target.value; render(); };
    $("#fCat").onchange = e => { ui.claimCat = e.target.value; render(); };
    document.querySelectorAll("tr[data-id]").forEach(tr=>{ const go=e=>{ if(e.target.closest("a")) return; ui.editing=tr.dataset.id; render(); window.scrollTo({top:0,behavior:"smooth"}); };
      tr.onclick=go; tr.onkeydown=e=>{ if(e.key==="Enter") go(e); }; });
  },
  file(){
    document.querySelectorAll("[data-fp]").forEach(b=>b.onclick=()=>{ ui.filePerson=b.dataset.fp; render(); });
    $("#copyFile").onclick = () => copyText($("#fileTxt").textContent, $("#fileTxt"));
  },
  settings(){
    document.querySelectorAll("form[data-pp]").forEach(f=>{
      f.addEventListener("change", e=>{ const p = person(f.dataset.pp), P = ps(p), t = e.target;
        if (t.name.startsWith("kid_")) P.kids[t.name.slice(4)] = Math.max(0, parseInt(t.value)||0);
        else if (t.type==="checkbox") P[t.name] = t.checked;
        else if (t.name==="housingLim") P.housingLim = +t.value;
        else if (t.name==="name") p.name = t.value.trim() || p.name;
        changed(); });
    });
    document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ if(!b.dataset.sure){ b.dataset.sure=1; b.textContent="Tap again to remove (their receipts too)"; return; }
      S.people = S.people.filter(p=>p.id!==b.dataset.rm); S.claims = S.claims.filter(c=>c.person!==b.dataset.rm); changed(); });
    if ($("#addPerson")) $("#addPerson").onclick = () => { S.people.push(blankPerson("Person "+(S.people.length+1))); changed(); };
    $("#exportBtn").onclick = () => copyText(JSON.stringify(S));
    $("#importToggle").onclick = () => { $("#importBox").hidden = !$("#importBox").hidden; };
    $("#importBtn").onclick = () => { try { const d = JSON.parse($("#importTxt").value); if(!d.people||!d.claims) throw 0; S = d; S.sample=false; changed(); toast("Backup restored"); } catch(e){ toast("That text is not a Cukai Keluarga backup."); } };
    if ($("#createBtn")) $("#createBtn").onclick = createSheet;
    if ($("#joinBtn")) $("#joinBtn").onclick = () => { const m = $("#jLink").value.match(/[?&]s=([^&]+)&t=([^&#]+)/); if(!m) return toast("That link is missing its sheet code. Ask for the link from Copy link for spouse."); joinSheet(decodeURIComponent(m[1]), decodeURIComponent(m[2])); };
    if ($("#copyLink")) $("#copyLink").onclick = () => copyText(location.origin + location.pathname + `?s=${encodeURIComponent(conn.id)}&t=${encodeURIComponent(conn.token)}`);
    if ($("#pullNow")) $("#pullNow").onclick = () => pull(true);
    if ($("#disconnect")) $("#disconnect").onclick = () => { conn=null; try{localStorage.removeItem(LS_CONN);}catch(e){} setStatus(); render(); toast("This device is disconnected. Your sheet is untouched."); };
  }
};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.tab; ui.editing=null; render(); });

async function copyText(t, fallbackEl){
  try { await navigator.clipboard.writeText(t); toast("Copied"); }
  catch(e){ if (fallbackEl){ const r=document.createRange(); r.selectNodeContents(fallbackEl); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected — press copy"); } else toast("Copy is blocked here. Long-press to copy instead."); }
}

async function saveClaim(){
  const amount = +$("#cAmt").value;
  if (!(amount>0)) return toast("Enter the amount on the receipt.");
  const cat = $("#cCat").value, c = catOf(cat);
  const rec = ui.editing ? S.claims.find(x=>x.id===ui.editing) : { id:uid(), ya:S.ya, receipt:"" };
  Object.assign(rec, { person:$("#cPerson").value, cat, sub: c.subs ? $("#cSub").value : "", date:$("#cDate").value || new Date().toISOString().slice(0,10), amount, desc:$("#cDesc").value.trim() });
  const dy = +rec.date.slice(0,4);
  rec.ya = RULES[dy] ? dy : S.ya;
  if (rec.ya !== S.ya) setTimeout(()=>toast(`Dated ${dy}, so it is saved under ${RULES[dy].label}.`), 2700);
  const file = $("#cFile").files[0];
  const btn = $("#cSave");
  if (file && conn){
    btn.disabled = true; btn.textContent = "Uploading receipt…";
    try { rec.receipt = await uploadReceipt(file, rec); }
    catch(e){ toast("Receipt photo did not upload: " + e.message + ". The figures are saved."); }
  }
  if (!ui.editing) S.claims.push(rec);
  ui.editing = null; changed(); toast("Receipt saved");
}

/* ============ GOOGLE SHEET SYNC ============ */
function setStatus(state, text){
  const el = $("#status"); el.className = "pill " + (state||"");
  $("#statusText").textContent = text || (conn ? "Saved to Google Sheet" : "On this device only");
  if (!state && conn) el.classList.add("ok");
}
async function api(body){
  if (!API_URL) throw new Error("App is not linked to Google yet");
  const res = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Google returned an error");
  return j;
}
let syncTimer = null;
function queueSync(){ if (!conn) return; setStatus("busy","Saving…"); clearTimeout(syncTimer); syncTimer = setTimeout(push, 1200); }
async function push(){
  try { await api({ action:"save", id:conn.id, token:conn.token, data:S, rows:sheetRows() }); setStatus(); }
  catch(e){ setStatus("err","Not saved — " + e.message); }
}
async function pull(showToast){
  if (!conn) return;
  setStatus("busy","Loading…");
  try { const j = await api({ action:"load", id:conn.id, token:conn.token });
    if (j.data && j.data.people) { S = j.data; S.ya = prefYa(); saveLocal(); }
    else { await push(); }
    conn.name = j.name || conn.name; conn.url = j.url || conn.url; try{ localStorage.setItem(LS_CONN, JSON.stringify(conn)); }catch(e){}
    setStatus(); render(); if (showToast) toast("Loaded from Google Sheet");
  } catch(e){ setStatus("err","Offline — " + e.message); }
}
function sheetRows(){
  // Readable copies for the sheet's Receipts and Summary tabs
  const claims = S.claims.map(c=>[c.ya, c.date, person(c.person)?.name||"", catOf(c.cat)?.n||c.cat, catOf(c.cat)?.subs?.find(s=>s.k===c.sub)?.n||"", c.desc, +c.amount, c.receipt]);
  const summary = [];
  yearsWithData().forEach(y => withYa(y, () => S.people.forEach(p=>{ const c = compute(p); summary.push([y, p.name, c.gross, c.totalRelief, c.chargeable, c.tax, c.payable, c.pcb, c.balance]); })));
  return { claims, summary };
}
async function createSheet(){
  const name=$("#hName").value.trim(), kod=$("#hKod").value.trim(), email=$("#hEmail").value.trim();
  if (!name||!kod||!/@/.test(email)) return toast("Fill in household name, family code and Gmail.");
  const b=$("#createBtn"); b.disabled=true; b.textContent="Creating…";
  try { const j = await api({ action:"create", name, kod, email });
    conn = { id:j.id, token:j.token, name:j.name, url:j.url }; try{ localStorage.setItem(LS_CONN, JSON.stringify(conn)); }catch(e){}
    if (S.sample){ const a=blankPerson("Me"), c=blankPerson("Spouse"); S={v:1,ya:S.ya,sample:false,people:[a,c],income:{},claims:[]}; }
    saveLocal(); await push(); render(); toast("Sheet created and shared to " + email);
  } catch(e){ b.disabled=false; b.textContent="Create & connect"; toast(e.message); }
}
async function joinSheet(id, token){
  conn = { id, token }; try{ localStorage.setItem(LS_CONN, JSON.stringify(conn)); }catch(e){}
  await pull(true);
}
async function uploadReceipt(file, rec){
  let blob = file, mime = file.type || "application/octet-stream";
  if (mime.startsWith("image/")) { blob = await shrink(file); mime = "image/jpeg"; }
  if (blob.size > 8e6) throw new Error("file is over 8 MB");
  const b64 = await new Promise((ok,no)=>{ const fr=new FileReader(); fr.onload=()=>ok(String(fr.result).split(",")[1]); fr.onerror=no; fr.readAsDataURL(blob); });
  const who = person(rec.person)?.name || "";
  const nm = `${rec.date} ${who} ${catOf(rec.cat)?.n||rec.cat} RM${rec.amount}`.replace(/[\\/:*?"<>|]/g,"-") + (mime==="image/jpeg"?".jpg":mime==="application/pdf"?".pdf":"");
  const j = await api({ action:"upload", id:conn.id, token:conn.token, name:nm, mime, b64 });
  return j.url;
}
function shrink(file){
  return new Promise((ok)=>{ const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const m = 1600, s = Math.min(1, m/Math.max(img.width,img.height)); const cv = document.createElement("canvas");
      cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(u); cv.toBlob(b=>ok(b||file),"image/jpeg",0.82); };
    img.onerror = () => ok(file); img.src = u; });
}

/* ============ START ============ */
(function start(){
  const q = new URLSearchParams(location.search);
  if (q.get("s") && q.get("t") && API_URL){
    conn = { id:q.get("s"), token:q.get("t") }; try{ localStorage.setItem(LS_CONN, JSON.stringify(conn)); }catch(e){}
    history.replaceState(null,"",location.pathname);
  }
  if (!API_URL) conn = null;
  S.ya = prefYa();
  setStatus(); render();
  if (conn) pull(false);
})();
</script>
